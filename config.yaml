# ── Auto-checkout ────────────────────────────────────────────────────────
# Set auto_checkout: true on a product above to arm it (it must have max_price).
# Before going live:
#   1. npm run login -- target | best-buy | pokemon-center   (one time, per retailer)
#   2. put CVVs in .env (see .env.example)
#   3. npm run checkout-test -- <retailer> <id>   → should end in "dry_run"
#   4. set dry_run: false, enabled: true
# enabled / dry_run / auto_checkout are re-read on every attempt — no restart needed.
checkout:
  enabled: false               # master kill switch
  dry_run: true                # stop at the "Place order" button (no purchase)
  headless: false              # headed Chrome passes bot checks far more often
  max_orders_per_product: 1    # lifetime orders per product (tracked in data/orders.json)
  max_total_spend: 300         # lifetime spend cap across all products ($)
  max_total_overage_pct: 20    # order total may exceed max_price by this % (tax/shipping)
  retry_cooldown_seconds: 60   # wait after a failed attempt before retrying
  step_timeout_seconds: 20     # per-step wait
  queue_wait_minutes: 30       # how long to sit in a waiting room / BB "Please Wait"
  profile_dir: ~/.drop-bot/profiles

# ── Monitor settings ─────────────────────────────────────────────────────
monitor:
  interval_seconds: 3       # poll interval per retailer
  pc_queue_check_seconds: 5 # Pokemon Center queue status check interval
  backoff_on_429: 30        # seconds to back off on rate limit
  max_consecutive_errors: 10 # restart the monitor after this many errors

# ── Stealth browser settings (Pokemon Center only) ───────────────────────
stealth:
  headless: true
  captcha_timeout_seconds: 45
  page_load_timeout_ms: 30000

# ── Notifications ────────────────────────────────────────────────────────
notifications:
  throttle_same_product_seconds: 300  # don't re-alert for same product within 5 min
  throttle_same_retailer_seconds: 10  # rate-limit alerts per retailer