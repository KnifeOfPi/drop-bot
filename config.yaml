# ── Monitor settings ─────────────────────────────────────────────────────
monitor:
  interval_seconds: 3       # poll interval per retailer
  pc_queue_check_seconds: 5 # Pokemon Center queue status check interval
  backoff_on_429: 30        # seconds to back off on rate limit
  max_consecutive_errors: 10 # restart the monitor after this many errors

# ── Stealth browser settings (Pokemon Center only) ───────────────────────
stealth:
  headless: true
  captcha_timeout_seconds: 45
  page_load_timeout_ms: 30000

# ── Notifications ────────────────────────────────────────────────────────
notifications:
  throttle_same_product_seconds: 300  # don't re-alert for same product within 5 min
  throttle_same_retailer_seconds: 10  # rate-limit alerts per retailer